# Inference / sampling

defaults:
  - model: tora
  - data: main/bbad_everyday
  - trainer: infer
  - loggers: wandb
  - _self_
  - override hydra/hydra_logging: disabled

# Seed
seed: 42

# Disable hydra logging
hydra:
  verbose: false
  run:
    dir: ${log_dir}

# Data
data_root: ./demo/data
data:
  batch_size: 1
  num_workers: 1

# Log directory
log_dir: ./demo/sample

# Checkpoint path
ckpt_path: null          # when null, the checkpoint will be downloaded from Hugging Face

# Model settings
model:
  encoder_ckpt: null
  flow_model_ckpt: null
  n_generations: 3
  save_results: true     # save evaluation results to log_dir/results

# Switchable adapters (off by default -- this is the base training recipe).
# Enable with `lora.enabled=true`. See tora/modeling/lora.py and
# scripts/verify_lora_reversible.py.
lora:
  enabled: false
  r: 128
  alpha: 256
  dropout: 0.1
  last_n_blocks: 6
  train_head: true
  # active=false loads the adapter and switches it OFF -- the do-no-harm arm,
  # which is the base model bit-for-bit.
  active: true
