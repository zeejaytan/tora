_target_: tora.data.PointCloudDataModule
num_points_to_sample: 5000
min_parts: 2
# 64, not the Juglet's 20: U10 breakages run 3-36 sherds, and 20 would silently
# drop every breakage above it (ticket 02, loader check).
max_parts: 64
min_points_per_part: 20
# The largest sherd held in place, as bbad_everyday (the untouched model's data)
# and wear v3 were trained. Reason in ticket 02, "Anchor".
anchor_free: false
multi_anchor: false

data_root: ${data_root}
# U10 arm "ceiling" -- vessels of the Juglet's own type, i.e. "shown the answer's shape" (spec).
# Built by scripts/write_u10_trainset.py, audited by scripts/audit_u10_trainset.py
# (ticket 02, PASS 2026-09-21). 349 training breakages (train), the choosing
# vessels as val, test empty. The arms match in count on purpose.
dataset_names: ["u10_ceiling"]
up_axis: {
  "u10_ceiling": "z",
}

batch_size: 8
num_workers: 8
persistent_workers: true
# 0 = no repetition. The default (2000) repeats the 349 breakages until the file
# reaches that size, so one "epoch" would be ~5.7 passes and epoch counts would
# not mean what the tickets say (tickets 03/04).
min_dataset_size: 0
limit_val_samples: 0
