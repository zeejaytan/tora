_target_: tora.data.PointCloudDataModule
num_points_to_sample: 5000
min_parts: 2
max_parts: 20
min_points_per_part: 20
anchor_free: false
multi_anchor: false

data_root: ${data_root}
# Vessel-shape variety, rebuilt (v3), with the solid lumps removed.
#
# The gap the conservator named: "the dataset provides more variety as to the
# shapes that get trained; we can make the relevant object fragment worn, but
# we don't have the shape/object in training." The fine-tuning source had EIGHT
# ceramic vessels.
#
# WHAT V3 FIXED, and it is not what the old header claimed. In the previous
# file 49.22% of fragment vertices sat exactly on top of a vertex of a
# neighbouring fragment: the break faces were congruent copies, so the network
# could seat a sherd by matching a surface to its own mirror image, which no
# real sherd offers. v3 rebuilds those faces -- 0.00% coincident. That is a fix
# to break-surface SHAPE, which is the only thing TORA's frozen encoder reads.
#
# LUMPS REMOVED, not flagged. 37% of the corpus sectioned as a solid lump
# rather than a vessel. Those examples are gone from train/val/test here
# (`scripts/filter_lumps_from_splits.py`, fill remeasured on this file), with
# the untouched membership kept beside them as train_all / val_all / test_all.
# 1,169 train / 117 val / 117 test, 203 distinct shapes, split on the OBJECT so
# no shape appears on both sides. Section fill of what remains: median 0.203.
# Checked by eye at the threshold, not only in aggregate:
# `artifacts/lump_cut_boundary.png`.
#
# The cells-through-wall half of the corpus screen is deliberately NOT applied.
# It would raise the median wall thickness of the kept set from 2.10% to 5.86%
# of object -- keeping the vessels TORA finds easy and dropping the thin-walled
# ones, which are the closest thing here to real archaeological sherds.
#
# CAUTION: `test` is a verbatim copy of `val` (build_bbad_vessel_trainset.py
# :417). There is no independent held-out set in this file.
#
# Two wear doses per break (0.05% and 0.10% recession); 0.20% was dropped for
# costing one object 6.6% of its curve.
#
# NO SYNTHETIC REPLAY, and that is a departure from wear_finetune_v2 on purpose.
# Replay (pig/rib) was there because a full fine-tune overwrites the weights it
# is trying to keep -- wear_v1 bought +0.235 seating on worn material by losing
# 0.115 on fresh. An adapter cannot do that: switching it off restores the base
# model bit-for-bit, so the do-no-harm arm is guaranteed by construction rather
# than bought with replay data. GARF's own fine-tune config does the same --
# one domain, no replay.
#
# Rings are NOT filtered. 13.9% of these fragments wrap the full way round and
# close into a hoop; the Juglet itself does that on 2 of its 9 pieces (22%),
# including its base at 40% of the pot. See docs/lessons.md, 2026-08-23.
dataset_names: ["bbad_vessels_v3"]

batch_size: 8
num_workers: 8
# Keep the loader's workers alive between epochs. This run validates every
# epoch, and every worker teardown is a chance for one to die on the way
# out -- which is how job 29825847 ended, at the close of epoch 0.
persistent_workers: true
min_dataset_size: 600
limit_val_samples: 0
